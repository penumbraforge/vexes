name: Publish

on:
  release:
    types: [published]
  # Manual re-run path: release-triggered runs execute the workflow file at
  # the tag's commit, so a workflow fix on main can't rescue a failed
  # release publish without this.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm's OIDC trusted publishing needs npm >= 11.5; runners can lag.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
