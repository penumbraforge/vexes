name: Benchmark

on:
  workflow_dispatch:
  # Weekly freshness check of OSV ground truth + pinned sampled FP controls
  schedule:
    - cron: '37 6 * * 1'
  pull_request:
    branches: [main]
    paths: ['src/**', 'benchmark/**', 'test/test-benchmark.js', 'test/test-signal-semantics.js', 'BENCHMARK.md', '.github/workflows/benchmark.yml']
  push:
    branches: [main]
    paths: ['src/**', 'benchmark/**', 'test/test-benchmark.js', 'test/test-signal-semantics.js', 'BENCHMARK.md', '.github/workflows/benchmark.yml']

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # PRs run the deterministic/OSV gates separately so a failure names the
      # affected trust boundary. Part C is network-heavier and runs on main.
      - name: Part A — exact advisory identity gate
        if: github.event_name == 'pull_request'
        run: node benchmark/run.mjs --part a

      - name: Part B — technique and negative-control gate
        if: github.event_name == 'pull_request'
        run: node benchmark/run.mjs --part b

      # Main pushes and the weekly schedule run all three gates. Part C is
      # digest-pinned bounded sampling: it reports status INCOMPLETE/exit 0
      # when its measurement succeeds, but execution errors, current blocking
      # advisories, and FP-ceiling regressions still fail this job.
      - name: Full benchmark — all gates
        if: github.event_name != 'pull_request'
        run: node benchmark/run.mjs
